<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crea y descarga una propuesta personalizada de fotografía de boda con Sisal Studio."><title>Cotiza tu Boda | Sisal Studio</title><link rel="canonical" href="https://sisal-studio.vercel.app/cotizar/"></head><body><div data-site-header></div><main class="quote-page"><section class="quote-intro"><p class="eyebrow eyebrow--light">Propuesta personalizada</p><h1>Comencemos a imaginar su historia.</h1><p>Completa los detalles y descarga una propuesta inicial en PDF.</p></section><section class="quote-panel"><form class="quote-form" data-quote-form><label>Nombre<input name="cliente_nombre" autocomplete="name" required></label><label>Fecha de boda<input name="fecha_boda" type="date" required data-quote-date></label><label>Venue<input name="venue" placeholder="Hacienda, hotel o ciudad" required></label><label>Paquete<select name="paquete_id" required><option value="esencial">Esencial · 6 horas</option><option value="editorial">Editorial · 9 horas</option><option value="legado">Legado · 12 horas</option></select></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>WhatsApp<input name="whatsapp" type="tel" autocomplete="tel" required></label><button class="button quote-form__submit" type="submit"><span>Generar propuesta PDF</span></button><p class="quote-form__status" role="status" data-quote-status></p></form></section></main><div data-site-footer></div><script type="module" src="/src/scripts/pages/cotizar.js"></script></body></html>
