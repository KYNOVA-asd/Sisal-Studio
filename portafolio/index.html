<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portafolio completo de fotografía Fine Art de Sisal Studio: bodas, XV años, eventos y locaciones en Yucatán y Riviera Maya.">
  <title>Portafolio Fine Art completo | Sisal Studio</title>
  <link rel="canonical" href="https://sisalstudio.mx/portafolio/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portafolio Fine Art | Sisal Studio">
  <meta property="og:description" content="Explora la colección fotográfica completa de Sisal Studio.">
  <meta property="og:url" content="https://sisalstudio.mx/portafolio/">
</head>
<body>
  <div data-site-header></div>
  <main class="portfolio-page">
    <header class="portfolio-heading">
      <p class="eyebrow">Archivo visual</p>
      <h1>Todas las historias.</h1>
      <p>Una selección abierta de bodas, retratos, celebraciones y espacios que nos inspiran.</p>
      <div class="portfolio-filters" data-portfolio-filters aria-label="Filtrar portafolio">
        <button class="is-active" type="button" data-filter="all">Todo</button>
        <button type="button" data-filter="bodas">Bodas</button>
        <button type="button" data-filter="eventos">XV & Eventos</button>
        <button type="button" data-filter="locaciones">Locaciones</button>
      </div>
    </header>
    <section class="portfolio-wall" data-portfolio-wall aria-live="polite"></section>
    <p class="portfolio-empty" data-portfolio-empty hidden>No encontramos fotografías en esta categoría.</p>
    <section class="portfolio-cta">
      <p class="eyebrow eyebrow--light">Tu historia puede ser la siguiente</p>
      <h2>Convirtamos tu fecha en una colección.</h2>
      <a href="/cotizar/">Consultar disponibilidad</a>
    </section>
  </main>
  <dialog class="portfolio-lightbox" data-portfolio-lightbox>
    <button type="button" data-portfolio-close aria-label="Cerrar imagen">×</button>
    <img alt="Fotografía Fine Art ampliada" data-portfolio-full>
    <p data-portfolio-caption></p>
  </dialog>
  <div data-site-footer></div>
  <script type="module" src="/src/scripts/pages/portafolio.js"></script>
</body>
</html>
